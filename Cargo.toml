[package]
name = "chrome-devtools-cli"
version = "2.5.0"
edition = "2021"
# std::fs::File::{lock, try_lock} and std::fs::TryLockError (daemon lock path)
# stabilized in 1.89
rust-version = "1.89"
description = "Chrome DevTools Protocol CLI — auto-connects to existing Chrome"
authors = ["Aero <aero.windwalker@gmail.com>"]
license = "MIT"
repository = "https://github.com/aeroxy/chrome-devtools-cli"

[[bin]]
name = "chrome-devtools"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4.44"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
futures-util = "0.3"
# Already built for tungstenite; used for HTTP status phrases and header names.
http = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toon-format = "0.5"
# wss:// for remote CDP endpoints. rustls needs no OpenSSL, so release builds
# stay self-contained, and native roots trust what the OS trusts.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# tokio-tungstenite pulls in rustls with no crypto provider. Enabling exactly
# one here lets rustls install it on first use, so nothing has to in main().
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
htmd = "0.5.4"
dom_smoothie = "0.18.0"
html-escape = "0.2.13"

[dev-dependencies]
tempfile = "3"
